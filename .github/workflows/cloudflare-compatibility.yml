name: Cloudflare compatibility (preview only)

on:
  push:
    branches:
      - cloudflare-workers-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install exact project dependencies
        run: npm ci
      - name: Test application and isolated PostgreSQL policies
        run: npm test
      - name: Validate types
        run: npm run typecheck
      - name: Build Workers artifact without deployment
        run: npm run workers:build
      - name: Validate Worker package locally
        run: npm run workers:check
      - name: Exercise local Workers runtime and image/R2 bindings
        run: npm run workers:smoke
