name: Cloudflare checks and publication

on:
  push:
    branches:
      - cloudflare-workers-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install exact project dependencies
        run: npm ci
      - name: Test application and isolated PostgreSQL policies
        run: npm test
      - name: Validate types
        run: npm run typecheck
      - name: Build Workers artifact without deployment
        run: npm run workers:build
      - name: Validate Worker package locally
        run: npm run workers:check
      - name: Exercise local Workers runtime and image/R2 bindings
        run: npm run workers:smoke

  deploy:
    needs: check
    if: github.ref == 'refs/heads/cloudflare-workers-preview' && vars.CLOUDFLARE_AUTODEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PHOTO_ENV: cloudflare
      NEXT_PUBLIC_SUPABASE_URL: https://vnngqilclvxaeewzpinl.supabase.co
      SUPABASE_ALLOWED_URL: https://vnngqilclvxaeewzpinl.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: https://checklist-dd.checklist-operacional-dd.workers.dev
    steps:
      - name: Check publishing configuration without displaying values
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo 'Missing public Supabase key variable'; exit 1; }
      - name: Checkout the exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install exact project dependencies
        run: npm ci
      - name: Build the published configuration
        run: npm run workers:build
      - name: Check the production package without publishing
        run: node node_modules/wrangler/bin/wrangler.js deploy --config wrangler.production.jsonc --dry-run
      - name: Check anonymous routes and local image/R2 bindings
        run: npm run workers:smoke
      - name: Publish Cloudflare app and photo-retention scheduler
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node node_modules/wrangler/bin/wrangler.js deploy --config wrangler.production.jsonc --keep-vars --message "GitHub ${GITHUB_SHA}"
          node node_modules/wrangler/bin/wrangler.js deploy --config cloudflare/wrangler.retention.production.jsonc --keep-vars --message "GitHub ${GITHUB_SHA}"
      - name: Verify the public login and protected routes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = process.env.NEXT_PUBLIC_APP_URL;
          for (const [path, status] of [['/login', 200], ['/painel', 307], ['/api/photos/11111111-1111-1111-1111-111111111111', 401]]) {
            const response = await fetch(base + path, { redirect: 'manual', signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, status, path);
          }
          console.log('Cloudflare publication verified.');
          JS
