function num(x){return x.toLocaleString('pt-BR')};function percent(x,total){return total?Math.round(x*100/total):0};function pill(status){return `<span class="pill ${status}">${STATUS[status]||status}</span>`};function storeName(id){return STORES.find(s=>s.id===id)?.name||id};function catName(i){return CATEGORIES[i]||'Outra'};

function reportsPage(){const t=filtered(),completed=t.filter(x=>x.status==='completed').length,late=t.filter(x=>x.status==='pending').length;const rate=percent(completed,t.length);const st=accessibleStores().filter(s=>!state.store||s.id===state.store).map(s=>{let a=t.filter(x=>x.store===s.id);return {name:s.name,total:a.length,done:a.filter(x=>x.status==='completed').length,open:a.filter(x=>x.status!=='completed').length,rate:percent(a.filter(x=>x.status==='completed').length,a.length)}});return `${head('Relatórios','Consolide a execução das lojas, filtre os dados e exporte uma amostra em CSV.',`<button class="btn btn-primary" onclick="exportCSV()">⇩ Exportar CSV</button>`,'INDICADORES E EXPORTAÇÕES')}${filters()}<div class="stats">${stat('Atividades previstas',t.length,'Período demonstrativo','▣')}${stat('Concluídas',completed,`${rate}% de execução`,'✓','pink')}${stat('Em aberto',t.length-completed,'Pendentes ou em revisão','◷','outline')}</div><div class="grid-2"><div class="card">${cardHeader('Execução do período','Percentual consolidado')}<div class="card-body"><div class="progress-big"><strong>${rate}%</strong><div>Execução de todas as atividades</div></div><div class="progress-track"><div class="progress-fill" style="width:${rate}%"></div></div><div class="legend">${Object.keys(STATUS).map(s=>`<span>${pill(s)} ${t.filter(x=>x.status===s).length}</span>`).join('')}</div></div></div><div class="card">${cardHeader('Resumo por loja','Total e conclusão no filtro atual')}<div class="card-body">${st.map(x=>`<div class="ranking-item" style="grid-template-columns:1fr 50px"><div><strong>${x.name} · ${x.done}/${x.total}</strong><div class="progress-track"><div class="progress-fill" style="width:${x.rate}%"></div></div></div><small>${x.rate}%</small></div>`).join('')}</div></div></div><div class="card">${cardHeader('Detalhamento das atividades','Relatório demonstrativo · exportação CSV local')}${taskTable(t.slice(0,30))}</div>`}
function historyPage(){return `${head('Histórico','Acompanhe alterações, execuções e aprovações registradas.',`<button class="btn btn-outline" onclick="go('atividades')">Ver atividades</button>`)}<div class="card">${cardHeader('Linha do tempo',`${visibleHistory().length} movimentações demonstrativas`)}${visibleHistory().map((x,i)=>`<div class="list-card"><span class="icon-circle">${i===0?'✓':i===1?'◉':'◷'}</span><div class="grow"><h3>${escapeHTML(x.action)}</h3><p><strong>${escapeHTML(x.title)}</strong> · ${escapeHTML(x.store)}</p><p style="margin-top:5px">${escapeHTML(x.who)}</p></div><span class="sub">${x.time}</span></div>`).join('')}</div>`}
function profilePage(){const units=accessibleStores();return head('Meu perfil','Informações fictícias do usuário selecionado.')+'<div class="card profile-box"><div class="avatar" style="height:68px;width:68px;font-size:22px">'+initials(currentUser.name)+'</div><div><h2>'+escapeHTML(currentUser.name)+'</h2><p>'+escapeHTML(currentUser.email)+'</p><div class="mini-statline"><span>● Perfil: '+escapeHTML(currentUser.role)+'</span><span>● Lojas: '+escapeHTML(units.map(s=>s.name).join(', ')||'Nenhuma vinculada')+'</span></div></div></div><div class="notice" style="margin-top:17px">Teste visual sem autenticação, banco de dados ou compartilhamento de alterações. <button type="button" class="switch-demo-btn" onclick="showLogin()">Trocar usuário demonstrativo</button></div>'}
const pages={painel:dashboard,atividades:activities,lojas:storesPage,usuarios:usersPage,categorias:categoriesPage,modelos:modelsPage,relatorios:reportsPage,historico:historyPage,perfil:profilePage};
function render(){
  paintLogin();
  if(!currentUser){$('main').innerHTML='';return}
  if(!canAccessPage(state.page))state.page='painel';
  const p=state.page;const nav=$('nav');nav.replaceChildren();
  const label=document.createElement('p');label.className='nav-label';label.textContent='MENU PRINCIPAL';nav.appendChild(label);
  NAV.filter(x=>canAccessPage(x[0])).forEach(x=>{
    const button=document.createElement('button');button.type='button';button.className=x[0]===p?'active':'';
    button.onclick=()=>go(x[0]);const icon=document.createElement('span');icon.className='navico';icon.textContent=x[1];
    button.append(icon,document.createTextNode(x[2]));nav.appendChild(button);
  });
  const title=NAV.find(x=>x[0]===p);$('top-title').textContent=title?.[2]||'Meu perfil';$('top-sub').textContent=title?.[3]||'Dados de acesso';
  $('side-name').textContent=currentUser.name;$('side-role').textContent=currentUser.role+' · Demonstração';$('side-avatar').textContent=initials(currentUser.name);
  $('top-role').textContent=currentUser.role;$('top-avatar').textContent=initials(currentUser.name);
  renderMain();
}
function renderMain(){if(!currentUser)return;if(!canAccessPage(state.page))state.page='painel';$('main').innerHTML=(pages[state.page]||dashboard)()+`<div class="footer"><span>© 2026 D&D · Checklist Operacional</span><span>● Interface demonstrativa · sem conexão com servidor</span></div>`}
function closeModal(){$('modal-holder').innerHTML=''};function openTask(id){const t=tasks.find(x=>x.id===id);if(!t||!accessibleStores().some(s=>s.id===t.store))return;const statuses=Object.entries(STATUS).map(([key,value])=>`<option value="${key}" ${t.status===key?'selected':''}>${value}</option>`).join('');$('modal-holder').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h2>Detalhes da atividade</h2><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div><div class="modal-b"><div class="eyebrow">${storeName(t.store)} · ${catName(t.cat)}</div><h2 style="font-size:20px;color:var(--wine);margin:6px 0">${escapeHTML(t.title)}</h2><p style="font-size:12px;color:#977f8c;line-height:1.7">${escapeHTML(t.description)}</p><div class="mini-statline"><span>◷ Prazo: ${dstr(t.date)} ${t.hour}</span><span>▧ ${t.photo==='none'?'Sem foto':'Evidência fotográfica'}</span></div><div class="field" style="margin-top:24px"><label>Situação (simulação)</label><select id="t-status">${statuses}</select></div><div class="field"><label>Observação</label><textarea id="t-observation" rows="3" placeholder="Observação demonstrativa..."></textarea></div><div class="faux-upload">▧ &nbsp; Espaço para evidências fotográficas<br><span style="font-size:10px">Imagens reais não são enviadas neste protótipo</span></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="changeTask('${t.id}')">Salvar simulação</button></div></div></div></div>`}
function changeTask(id){let t=tasks.find(t=>t.id===id);const status=$('t-status')?.value;if(!t||!STATUS[status]||!accessibleStores().some(s=>s.id===t.store))return;t.status=status;history.unshift({time:'Agora',title:t.title,action:'Status alterado para '+STATUS[status],store:storeName(t.store),who:currentUser.name});closeModal();renderMain();toast('Alteração simulada. Nenhum dado real foi salvo.')}
function openModal(type){if(!isAdmin()){toast('Apenas o Gerente Comercial pode simular cadastros.');return;}const content={store:{title:'Nova loja',fields:`<div class="field"><label>Nome da loja</label><input id="m-name" placeholder="Ex.: D&D Nova Unidade" required></div><div class="field"><label>Gerente</label><input id="m-extra" placeholder="Nome do gerente"></div>`},user:{title:'Novo usuário',fields:`<div class="field"><label>Nome completo</label><input id="m-name" placeholder="Nome do colaborador" required></div><div class="field"><label>E-mail</label><input id="m-extra" type="email" placeholder="nome@exemplo.com"></div>`},category:{title:'Nova categoria',fields:`<div class="field"><label>Nome da categoria</label><input id="m-name" placeholder="Ex.: Atendimento" required></div>`},newtask:{title:'Novo modelo de tarefa',fields:`<div class="field"><label>Nome da tarefa</label><input id="m-name" placeholder="Ex.: Conferência de estoque" required></div><div class="field"><label>Categoria</label><select id="m-extra">${CATEGORIES.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select></div><div class="field"><label>Descrição</label><textarea id="m-description" rows="3" placeholder="Instruções da tarefa"></textarea></div>`}}[type];if(!content)return;$('modal-holder').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h2>${content.title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-b"><div class="notice">Cadastro de demonstração. As informações não serão enviadas a nenhum servidor.</div>${content.fields}<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="addDemo('${type}')">Criar demonstração</button></div></div></div></div>`;$('m-name')?.focus()}
function addDemo(type){if(!isAdmin())return;const name=$('m-name')?.value.trim();if(!name){toast('Preencha o nome para continuar.');return}const extra=$('m-extra')?.value.trim()||'';if(type==='store'){let id='LOJA-'+String(STORES.length+1).padStart(3,'0');STORES.push({id,name,manager:extra||'Não informado',sup:'Supervisora Regional'});tasks.push(...TEMPLATES.slice(0,5).map((t,i)=>({id:'T'+(++seq),title:t[0],cat:t[1],rec:t[2],hour:t[3],photo:t[4],description:t[5],store:id,status:'pending',date:today.toISOString()})))}if(type==='user'){USERS.push({name,email:extra||'nao-informado@dd.local',role:'Gerente de Loja',store:'A definir'})}if(type==='category'){CATEGORIES.push(name)}if(type==='newtask'){let cat=Number(extra)||0;TEMPLATES.push([name,cat,'Diária','10:00','optional',$('m-description')?.value||'Tarefa criada na demonstração']);STORES.forEach(s=>tasks.push({id:'T'+(++seq),title:name,cat,rec:'Diária',hour:'10:00',photo:'optional',description:$('m-description')?.value||'',store:s.id,status:'pending',date:today.toISOString()}))}closeModal();renderMain();toast('Item criado apenas nesta demonstração.')}
function exportCSV(){let values=[['Loja','Atividade','Categoria','Status','Prazo'],...filtered().map(x=>[storeName(x.store),x.title,catName(x.cat),STATUS[x.status],dateFull(x.date)])];let csv='\ufeff'+values.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='checklist-dd-prototipo.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('CSV demonstrativo gerado.')}
function toast(message){$('toast-holder').innerHTML=`<div class="toast">${escapeHTML(message)}</div>`;setTimeout(()=>$('toast-holder').innerHTML='',2900)}
render();
</script>
</body>
</html>
